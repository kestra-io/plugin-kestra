# See GitHub's docs for more information on this file:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "weekly"
    labels:
      - "dependency-upgrade"
    open-pull-requests-limit: 50

  # Maintain dependencies for Gradle modules
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      # Check for updates to Gradle modules every week
      interval: "weekly"
    labels:
      - "dependency-upgrade"
    open-pull-requests-limit: 50
    groups:
      kestra-gradle-plugins:
        patterns:
          - "io.kestra.gradle.*"

  # Same updates for the line that targets the current Kestra release (see AGENTS.md)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "releases/v2.0.x"
    schedule:
      interval: "weekly"
    labels:
      - "dependency-upgrade"
    open-pull-requests-limit: 50

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "releases/v2.0.x"
    schedule:
      interval: "weekly"
    labels:
      - "dependency-upgrade"
    open-pull-requests-limit: 50
    groups:
      kestra-gradle-plugins:
        patterns:
          - "io.kestra.gradle.*"
