name: Main

on:
  schedule:
    - cron: '0 4 * * 1,2,3,4,5'
  push:
    branches:
      - master
      - main
      - releases/*
    tags:
      - v*

  pull_request:
    branches:
      - master
      - main
      - releases/*

  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"
      kestra-version:
        description: 'Kestra version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: read
  pull-requests: write
  packages: read

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      kestra-version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "version=$(grep '^kestraVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  check:
    needs: detect-version
    uses: kestra-io/actions/.github/workflows/plugins.yml@main
    with:
      skip-test: ${{ github.event.inputs.skip-test == 'true' }}
      kestra-version: ${{ github.event.inputs.kestra-version != '' && github.event.inputs.kestra-version || needs.detect-version.outputs.kestra-version }}
    secrets: inherit
