name: Security scan

on:
  push:
    branches:
      - main
      - releases/*
      - next/*
    tags:
      - v*

  pull_request:
    branches:
      - main
      - releases/*
      - next/*

  workflow_dispatch:
    inputs:
      metadata:
        description: 'Extra key=value pairs added to every finding, one per line'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  scan:
    uses: kestra-io/actions/.github/workflows/plugin-security-scan.yml@main
    with:
      metadata: ${{ github.event.inputs.metadata }}
    secrets: inherit
